# The spare web server. It answers every page with the maintenance notice,
# using status 503 ("service unavailable"), which is the honest status for a
# site that is down: search engines learn to come back later instead of
# remembering the notice as the page's content.
events {}
http {
  server {
    listen 80;
    root /usr/share/nginx/html;
    location = /health { return 200 "ok"; }
    location / { return 503; }
    error_page 503 /index.html;
    location = /index.html { internal; }
  }
}
