# Example 3: the front door has ONE main server and a spare page.
# While the main server answers, visitors get the real site.
# The moment it stops, visitors get the spare page instead of an error.
events {}
http {
  upstream site {
    # The real site. After one failure nginx leaves it alone for 3 s, then tries again.
    server fb-main:3000 max_fails=1 fail_timeout=3s;
    # "backup" means: only use this one when every normal server is unavailable.
    server fb-fallback:80 backup;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://site;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503;   # failed? go on to the backup
    }

    location = /front-health {
      return 200 "ok";
    }
  }
}
