# Example 1: one nginx does three jobs.
#   1. forwards each visitor to one of two back servers (load balancing)
#   2. remembers answers for a few seconds (cache), so the back servers do less work
#   3. shows a friendly page if both back servers are gone
events {}
http {
  # Where cached answers are kept: 10 MB of index, 50 MB of data, forgotten after 60 s unused.
  proxy_cache_path /var/cache/nginx keys_zone=site:10m max_size=50m inactive=60s;

  # The two back servers. If one fails to answer once (max_fails=1), nginx stops using it
  # for 5 s (fail_timeout), then tries it again. That is how a restored server rejoins.
  upstream backs {
    server ha1-back-a:3000 max_fails=1 fail_timeout=5s;
    server ha1-back-b:3000 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backs;
      proxy_connect_timeout 1s;                                  # give up on a dead server fast
      proxy_next_upstream error timeout http_502 http_503;       # then silently try the other one
      proxy_cache site;
      proxy_cache_valid 200 10s;                                 # reuse a good answer for 10 s
      add_header X-Cache-Status $upstream_cache_status always;   # HIT or MISS, visible to students
      error_page 502 503 504 =503 /down.html;                      # both servers gone: friendly page, honest status 503
    }

    # Lets the live page ask "is the front door itself alive?" without involving the back servers.
    location = /front-health {
      return 200 "ok";
    }

    location = /down.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}
