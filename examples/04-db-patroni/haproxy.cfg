# HAProxy hides the cluster behind ONE address. Applications always connect to port 5432 here;
# HAProxy sends them to whichever node is currently the leader.
defaults
  mode tcp                     # PostgreSQL is not HTTP, so HAProxy just passes bytes along
  timeout connect 2s
  timeout client  30m
  timeout server  30m
  timeout check   1s           # a health check that takes longer than 1 s counts as failed

listen postgres
  bind *:5432
  option httpchk GET /primary  # Patroni answers 200 on /primary ONLY on the current leader
  http-check expect status 200
  # inter 1s fall 2: ask every second, two failed answers in a row mark a node down. For about
  # 2-3 seconds after a failover, HAProxy may still send a connection to the dead node; applications
  # must retry (see the README).
  # on-marked-down shutdown-sessions: when a node stops being leader, cut its connections
  # right away, so applications reconnect to the new leader instead of hanging.
  default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server pg1 pat-pg1:5432 check port 8008
  server pg2 pat-pg2:5432 check port 8008
  server pg3 pat-pg3:5432 check port 8008
