# Example 2, layer 2: HAProxy. Its only job is to share visitors between healthy back servers.
global
  log stdout format raw local0

defaults
  mode http
  timeout connect 1s        # give up on a dead server fast
  timeout client  5s
  timeout server  5s
  retries 1
  option redispatch         # if the chosen server fails, try another one for the same request

frontend web
  bind *:8080
  monitor-uri /haproxy-health          # lets the live page ask "is HAProxy alive?"
  default_backend backs

backend backs
  balance roundrobin                   # take turns
  option httpchk GET /health           # ACTIVE health check: ask every server every second
  http-check expect status 200
  # fall 1 = one failed check removes a server, rise 2 = two good checks bring it back
  server a ha2-back-a:3000 check inter 1s fall 1 rise 2
  server b ha2-back-b:3000 check inter 1s fall 1 rise 2
  # when no server is healthy, answer with this friendly page instead of a bare error
  errorfile 503 /usr/local/etc/haproxy/down.http

# HAProxy's famous statistics page: shows every server, green or red, with counters.
frontend stats
  bind *:8404
  stats enable
  stats uri /
  stats refresh 2s
