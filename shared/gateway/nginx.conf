# The gateway sits in front of the status service. It decides who may do what:
#   everyone  -> see the live page and /api/status (read-only)
#   teachers  -> /teacher/ and /api/control, protected by a password (HTTP basic auth)
# The passwords live in the file "htpasswd", which is created by scripts/make-teacher-password.sh
# and is never committed to git.
events {}
http {
  server {
    listen 80;

    # Public: the live page and its data.
    location / {
      proxy_pass http://status:3000;
    }

    # Teachers only: the page with Stop/Start buttons.
    location /teacher/ {
      auth_basic "Teachers only";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_pass http://status:3000;
    }

    # Teachers only: the call the buttons make. Without a valid login nginx answers 401
    # and the request never reaches the status service.
    location = /api/control {
      auth_basic "Teachers only";
      auth_basic_user_file /etc/nginx/htpasswd;
      proxy_pass http://status:3000;
    }
  }
}
