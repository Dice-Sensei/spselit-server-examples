<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  #targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; margin: 1rem 0; }
  .box { border: 1px solid #888; border-radius: 8px; padding: .75rem; display: flex; flex-direction: column; gap: .4rem; }
  .up { background: #e6f4ea; border-color: #2e7d32; }
  .down { background: #fdecea; border-color: #c62828; }
  #warning { color: #c62828; font-weight: bold; }
  #note { color: #8a6d00; }
</style>
</head>
<body data-teacher="false">
<h1>Live demo</h1>
<p id="caption"></p>
<div id="targets"></div>
<p id="warning"></p>
<p id="note"></p>
<script src="/app.js"></script>
</body>
</html>
