<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live demo (teacher)</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-teacher="true">
<main>
<header>
  <h1 id="title">Live demo (teacher)</h1>
  <span class="badge">Teacher view</span>
</header>
<p id="about"></p>
<p id="tryThis" hidden></p>
<div id="legend">
  <span><span class="dot up"></span>Green: this part is working</span>
  <span><span class="dot down"></span>Red: this part is stopped or not answering</span>
  <span>The page refreshes by itself every 2 seconds.</span>
</div>
<div id="targets"></div>
<p id="warning"></p>
<p id="note"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
